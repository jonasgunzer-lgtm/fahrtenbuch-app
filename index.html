<!DOCTYPE html>
<html lang="de" data-theme="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Bonjour – Französisch lernen</title>
<meta name="description" content="Täglich 15 Minuten Französisch: Vokabeln, Hören und Schreiben mit Level-System – komplett offline." />
<meta name="theme-color" content="#2f5fd0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bonjour" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">
  <main id="views">
    <section id="view-home" class="view active"></section>
    <section id="view-themen" class="view"></section>
    <section id="view-lesson" class="view"></section>
    <section id="view-stats" class="view"></section>
    <section id="view-mehr" class="view"></section>
  </main>

  <nav id="tabbar">
    <button data-nav="home" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg>
      <span>Lernen</span>
    </button>
    <button data-nav="themen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
      <span>Themen</span>
    </button>
    <button data-nav="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20h3v-7H4zm6.5 0h3V4h-3zM17 20h3v-11h-3z"/></svg>
      <span>Statistik</span>
    </button>
    <button data-nav="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 4a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 0 0-2-1.2L16 3H8l-.4 2.7c-.7.3-1.4.7-2 1.2l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.4-1c.6.5 1.3.9 2 1.2L8 21h8l.4-2.7c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      <span>Mehr</span>
    </button>
  </nav>
</div>

<!-- Lernsession -->
<div id="session">
  <header id="s-top">
    <button class="icon-btn close" data-act="close" aria-label="Session beenden">✕</button>
    <div class="s-progress-wrap"><i id="s-progress"></i></div>
    <span id="s-count">0 / 0</span>
  </header>
  <div id="s-meta"><span id="s-lesson"></span><span id="s-strength"></span></div>
  <div id="s-body"></div>
  <footer id="s-foot"></footer>
</div>

<div id="modal"></div>
<div id="celebrate"></div>
<div id="toast"></div>

<script src="data/alltag.js"></script>
<script src="data/reise.js"></script>
<script src="js/content.js"></script>
<script src="js/srs.js"></script>
<script src="js/tts.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/session.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) { console.log("Offline-Modus nicht aktiv:", e.message); });
    });
  }
</script>
</body>
</html>
