<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E7D32" />
  <meta name="description" content="Fahrtenbuch und automatische Fahrtkostenerstattung" />
  <!-- iOS-/Android-Homescreen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fahrtenbuch" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Fahrtenbuch</title>
</head>
<body>
  <!-- Kopfzeile mit Titel und optionaler Fortschrittsanzeige -->
  <header class="app-header">
    <h1 class="app-title" id="screen-title">Fahrtenbuch</h1>
    <div class="progress" id="progress" hidden>
      <span id="progress-text"></span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>
  </header>

  <!-- Hauptbereich: hier werden die einzelnen Screens gerendert -->
  <main id="app" class="app-main"></main>

  <!-- Untere Navigationsleiste -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-nav="newEntry" type="button">
      <span class="nav-icon" aria-hidden="true">➕</span><span class="nav-label">Neue Fahrt</span>
    </button>
    <button class="nav-btn" data-nav="entries" type="button">
      <span class="nav-icon" aria-hidden="true">📋</span><span class="nav-label">Einträge</span>
    </button>
    <button class="nav-btn" data-nav="export" type="button">
      <span class="nav-icon" aria-hidden="true">📄</span><span class="nav-label">Export</span>
    </button>
    <button class="nav-btn" data-nav="settings" type="button">
      <span class="nav-icon" aria-hidden="true">⚙️</span><span class="nav-label">Einstellungen</span>
    </button>
  </nav>

  <!-- Vendor-Bibliotheken für den Word-Export (lokal, offline-fähig) -->
  <script src="vendor/pizzip.js"></script>
  <script src="vendor/docxtemplater.js"></script>
  <!-- App-Code (ES-Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
